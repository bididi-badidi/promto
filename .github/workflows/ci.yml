name: Build, Run tests, and Zip Chrome Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Zip extension
        run: |
          cd dist
          zip -r ../extension.zip .
          cd ..

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
